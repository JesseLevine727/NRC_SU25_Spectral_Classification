name: NATO SERS research validation

on:
  pull_request:
    paths:
      - "Projects/SERS_Classification/research/atlas_sers/**"
      - ".github/workflows/nato-sers-research.yml"
  push:
    paths:
      - "Projects/SERS_Classification/research/atlas_sers/**"
      - ".github/workflows/nato-sers-research.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Projects/SERS_Classification/research/atlas_sers
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: Projects/SERS_Classification/research/atlas_sers
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Projects/SERS_Classification/research/atlas_sers/pyproject.toml
      - name: Install TikZ build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils texlive-latex-base texlive-latex-extra texlive-pictures
      - name: Install pinned CPU PyTorch
        run: python -m pip install 'torch==2.11.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: python -m pip install -e ".[dev,viz,deep]"
      - name: Validate public boundary and plan contracts
        run: python scripts/validate_public_scaffold.py
      - name: Lint Python sources
        run: ruff check src scripts tests
      - name: Preflight torch dependency
        run: |
          python -c "import torch; assert torch.__version__.split('+')[0] == '2.11.0', torch.__version__; assert torch.version.cuda is None, torch.version.cuda; print('torch', torch.__version__, 'cuda', torch.version.cuda)"
      - name: Run tests
        run: pytest

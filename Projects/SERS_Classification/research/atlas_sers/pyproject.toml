[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-sers-research"
version = "0.1.0"
description = "Data-free research scaffold for acquisition-aware SERS classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.21",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=16",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "threadpoolctl>=3.5",
]

[project.optional-dependencies]
viz = [
  "hdbscan>=0.8.33",
  "plotly>=5.20",
  "umap-learn>=0.5.5",
]
deep = ["torch>=2.2"]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

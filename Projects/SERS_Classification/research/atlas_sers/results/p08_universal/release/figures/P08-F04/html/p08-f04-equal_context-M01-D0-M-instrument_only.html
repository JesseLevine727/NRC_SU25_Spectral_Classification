<!DOCTYPE html><html><head><meta charset="utf-8"><title>p08-f04-equal_context-M01-D0-M-instrument_only</title><style>body{font-family:"Times New Roman",Times,serif;font-size:16px;color:#000;margin:12px}figure{margin:0;position:relative}svg{background:#fff;display:block}.grid{stroke:#e6e6e6;stroke-width:1}.null{stroke:#000;stroke-width:1;stroke-dasharray:6 3 1 3}.dp{fill:none;stroke:#808080;stroke-width:0.8}.iv,.cap{stroke-width:2}circle.op,rect.op{stroke:#000;stroke-width:0.5}.tick,.ytick,.natick{font-size:16px;fill:#000}table{border-collapse:collapse;font-size:14px}.data-table{overflow:auto;max-height:420px}th,td{border:1px solid #999;padding:2px 4px;text-align:left}svg [tabindex]:focus{outline:2px solid #000;outline-offset:2px}.tip{display:none;position:fixed;background:#fff;color:#000;padding:3px 6px;font-size:16px;border:1px solid #000;pointer-events:none;z-index:10;max-width:420px}.scope{margin:2px 0 8px}.caption{margin:2px 0 8px}</style></head><body><figure id="p08-f04-equal_context-M01-D0-M-instrument_only"><figcaption><strong>RQ-S01 / P08-F04 model-by-preprocessing interaction</strong></figcaption><h2>RQ-S01 / P08-F04 model-by-preprocessing interaction</h2><p class="scope"><strong>Deep strategy:</strong> Ordinary CNN &middot; <strong>Endpoint:</strong> M01 individual-spectrum predictions &middot; <strong>Estimand:</strong> primary: equally weighted contexts within domain then equal domains &middot; <strong>Mode:</strong> instrument-only &middot; <strong>Scope:</strong> S panel: 6 available rows plotted, two planned QC rows in the table/CSV; 13 station/instrument domains, not independent samples</p><p class="caption">Positive interaction means preprocessing helped the deep strategy more (or hurt it less) than the comparator, not that the deep absolute balanced accuracy is higher. Whole pipelines: MIN is minimal min-max scaling; SG is impulse replacement, smoothing and min-max; arPLS is impulse replacement, baseline correction and min-max; all use 400-1800 cm^-1 and [0,1]. Source-only selection/calibration; frozen CNN recipe identity across policies. 598 original spectra, 69 physical masters, 10 instruments, 557 held spectra, 260 contexts, 13 domains. M01 uses individual predictions; M06 averages model probabilities within sample/instrument then equal instruments, not mean spectra. Gray points are domains, not independent samples. 95% marginal conditional intervals use 10,000 support-preserving weights; no retraining, no new-instrument uncertainty, no causal nuisance removal, no G4, no superiority or winner selection. Multiplicity family 32 retained; symmetry p-values are descriptive and no stars are drawn.</p><p>Semantic SHA-256: <code>7d136d1005cadbac7773e64dd39bb49d4ffc000a13fac4c4a3d1ee9c7742891a</code></p><p class="scope">Two planned QC contrasts are outside this universal run; no estimates.</p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-label="Positive interaction means preprocessing helped the deep strategy more (or hurt it less) than the comparator, not that the deep absolute balanced accuracy is higher. Whole pipelines: MIN is minimal min-max scaling; SG is impulse replacement, smoothing and min-max; arPLS is impulse replacement, baseline correction and min-max; all use 400-1800 cm^-1 and [0,1]. Source-only selection/calibration; frozen CNN recipe identity across policies. 598 original spectra, 69 physical masters, 10 instruments, 557 held spectra, 260 contexts, 13 domains. M01 uses individual predictions; M06 averages model probabilities within sample/instrument then equal instruments, not mean spectra. Gray points are domains, not independent samples. 95% marginal conditional intervals use 10,000 support-preserving weights; no retraining, no new-instrument uncertainty, no causal nuisance removal, no G4, no superiority or winner selection. Multiplicity family 32 retained; symmetry p-values are descriptive and no stars are drawn."><line class="grid" x1="240.0" y1="34" x2="240.0"
